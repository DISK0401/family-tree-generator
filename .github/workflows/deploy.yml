name: Deploy

on:
  push:
    branches:
      - develop
      - main

# GITHUB_TOKEN を読み取り専用にする(デプロイは CLOUDFLARE_API_TOKEN のみを使う)
permissions:
  contents: read

# 同一ブランチへの連続マージで古いコミットのデプロイが後勝ちしないよう直列化する
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify Cloudflare secrets are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が GitHub Secrets に設定されていません。docs/setup/cloudflare-manual-setup.md の手順に従って登録してください。"
            exit 1
          fi

      # Quality Gate はPRのマージ前コミットに対して走る。ここでのテストは
      # 「マージ結果」に対する最後の防壁(論理競合した2つの green PR を検出する)
      - run: npm run test

      - run: npm run build

      - name: Deploy to Cloudflare Workers (dev)
        if: github.ref_name == 'develop'
        run: npx wrangler deploy --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers (production)
        if: github.ref_name == 'main'
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
