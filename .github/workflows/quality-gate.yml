name: Quality Gate

on:
  pull_request:
    branches:
      - develop
      - main

# GITHUB_TOKEN を読み取り専用にする(npm ci が実行する依存の postinstall から
# 書き込み可能トークンへ到達できないようにする)
permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ジョブIDの `quality` は Rulesets の必須ステータスチェック名として参照されている。
  # `name:` を付けるとチェック名が表示名に変わり必須チェックが外れるため、付けないこと
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build

  # 実ブラウザのスモーク(外部送信ゼロの検証・IndexedDB復元)。
  # 必須チェックにする場合は Rulesets へチェック名 `e2e` を追加する
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
