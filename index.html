<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- @font-face定義(600件超)はバンドルCSSから分離し、描画をブロックせずに読み込む。
         適用はmain.tsxが行う(CSPでインラインscriptを禁止しているためonload属性は使えない) -->
    <link rel="preload" href="/fonts.css" as="style" />
    <title>家系図帖 - ブラウザだけで作る、あなたの家の家系図</title>
    <meta
      name="description"
      content="家系図帖(かけいずちょう)は、ブラウザだけで家系図を作れる無料サービス。データは端末内にのみ保存され、サーバーには送信されません。和暦対応・養子や再婚などの複雑な家族関係・GEDCOM入出力に対応。"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="家系図帖 - ブラウザだけで作る、あなたの家の家系図"
    />
    <meta
      property="og:description"
      content="データは端末の中だけ、サーバーに送信しない家系図作成サービス。和暦対応・複雑な家族関係・GEDCOM入出力。登録不要・無料。"
    />
    <!-- og:image/og:urlは絶対URL必須(主要SNSのスクレイパは相対パスを解決しない)。
         カスタムドメイン確定時はcanonicalと合わせて張り替える -->
    <link
      rel="canonical"
      href="https://family-tree-generator.disk0401.workers.dev/"
    />
    <meta
      property="og:url"
      content="https://family-tree-generator.disk0401.workers.dev/"
    />
    <meta
      property="og:image"
      content="https://family-tree-generator.disk0401.workers.dev/ogp.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
